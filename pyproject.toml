[project]
name = "aes67-vsc"
version = "0.1.0"
description = "AES67 + native Dante virtual soundcard"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = ["numpy", "sounddevice", "psutil", "zeroconf", "pystray", "pillow"]

[project.scripts]
aes67-vsc = "aes67vsc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
aes67vsc = ["ui.html"]
